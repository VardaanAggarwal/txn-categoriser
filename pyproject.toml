[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "txn-categoriser"
version = "0.1.0"
description = "Categorises Indian bank and UPI transactions with rules, a classical ML model and an optional LLM fallback"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Vardaan Aggarwal" }]
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.6",
    "scikit-learn>=1.4",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["txncat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
